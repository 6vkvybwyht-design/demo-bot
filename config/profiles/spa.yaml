        марокканською рукавичкою кесе, глазурування глиною гассул усього тіла та обличчя, миття
        голови з масажем, контрастні процедури, зволоження всього тіла молочком, користування
        басейном, відпочинок із чаюванням та пригощенням, ванночка для ніг.
    "Турецький хамам":
      category: hammam
      deposit: true
      uses: [{resource: thermal}]
      addons: *program_addons
      short: "Прогрів рушниками, скраб на вибір, пілінг турецькою рукавичкою кесе й мильний пінний масаж."
      full: >-
