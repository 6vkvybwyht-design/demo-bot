        басейном, відпочинок із чаюванням та пригощенням.

    # --- Спа-ритуали для двох ---
    "«Повне Перезавантаження» для двох":
      category: two
      deposit: true
      uses: [{resource: thermal}]
      guests: &two_guests {kinds: [{key: adults, label: "Гості", min: 2, max: 2}]}
