      guests:
        kinds: [{key: adults, label: "Гості", min: 3, max: 4}]
        tiers:
          3: {duration_min: 150, price: 9500}
          4: {duration_min: 180, price: 12000}
      addons: *program_addons
      short: "Слов'янське паріння для 3–4 гостей з індивідуальною пропаркою дубовими віниками."
      full: >-
        Прогрів у парній, ритуал першого пару — прогрів опахалом, ванночка для ніг із цитриною
        та морською сіллю, індивідуальна пропарка дубовими віниками, контрастні процедури,
        користування басейном, відпочинок із чаюванням та пригощенням.
    "Турецький хамам для компанії":
      category: company
      deposit: true
      uses: [{resource: thermal}]
      guests:
        kinds: [{key: adults, label: "Гості", min: 3, max: 4}]
        tiers:
          3: {duration_min: 150, price: 9500}
