        ванночки для ніг із цитриною та морською сіллю, індивідуальна пропарка дубовими віниками,
        мильно-березове розтирання всього тіла, прогрів гарячими повітряними потоками за
        допомогою простирадла, контрастні процедури, користування басейном, відпочинок із
        чаюванням та пригощенням.
    "Слов'янське паріння для двох":
      category: two
      deposit: true
      uses: [{resource: thermal}]
      guests: *two_guests
      addons: *program_addons
      short: "Ритуал першого пару й індивідуальна пропарка дубовими віниками — для двох."
      full: >-
