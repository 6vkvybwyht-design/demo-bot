      uses: [{resource: thermal}, {resource: cabinet, units: 2, last_min: 60}]
      guests: *two_guests
      addons: *program_addons
      short: "Гоммаж бельді, кесе, глазурування глиною гассул і марокканський релакс-масаж у кабінеті — для двох."
