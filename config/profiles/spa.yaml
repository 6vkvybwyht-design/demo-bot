# Профіль «Спа-комплекс» (Львів): масажі й термальна зона. BUSINESS_PROFILE=spa
# Ціни й тривалості — з прайсу комплексу (PDF). Час пишіть у лапках: "10:00".
#
# Ресурси: 2 масажні кабінети й термальна зона (хамам, лазня на дровах, сауна,
# басейн), яка бронюється цілком. Після кожного бронювання зони — 30 хв на підготовку.
# Вільні слоти враховують і майстра, і ресурси.

business:
  name: "SHUM VODY — онлайн-запис (демо)"
  address: "м. Львів, вул. Зелена, 1"
  phone: "+380 32 000 00 04"
  map_url: "https://maps.google.com/?q=вулиця+Зелена+1,+Львів"
  instagram: "https://instagram.com/demo.spa"

booking:
  timezone: "Europe/Kyiv"
  slot_step_min: 30
  horizon_days: 14
  min_lead_time_min: 60
  cancel_deadline_hours: 2
  # Із внесеним авансом перенести чи скасувати в боті можна за 48 год (аванс лишається
  # на депозиті); пізніше — через адміністратора
  deposit_deadline_hours: 48

# Нагадування клієнту — за день до візиту
reminders:
  before_24h: true
  before_2h: false

texts:
  SERVICE_ICON: "🧖"
  WELCOME: |-
    Вітаємо у <b>{name}</b>! 🌿

    Тут можна записатися на масаж, спа-програму чи відпочинок у термальній зоні, замовити подарунковий сертифікат, переглянути свої записи й правила відвідування.

    Оберіть дію в меню нижче.
  BTN_ANY_MASTER: "👥 Будь-який вільний"
  PRICE_FROM_NOTE: "\nℹ️ Точну ціну підтвердить адміністратор."
  DEMO_OWNER_VIEW: "👀 <b>Так це побачить адміністратор спа-комплексу:</b>\n\n{notification}"
  DEMO_OWNER_INTRO: |-
    👀 <b>Демо: так бот бачить адміністратор спа-комплексу.</b>

    Дані тестові й щоночі о 04:00 скидаються — можна сміливо натискати все, зокрема «💳 Аванс отримано». Телефони й імена інших відвідувачів приховано; свої записи ви бачите повністю.

spa:
  resources:
    cabinet: {name: "Масажний кабінет", capacity: 2}
    thermal: {name: "Термальна зона", capacity: 1, cleanup_min: 30}

  # Ресурси займаються лише в години роботи комплексу
  opening_hours:
    - {weekdays: [0], start: "13:00", end: "21:00"}
    - {weekdays: [1, 2, 3, 4, 5, 6], start: "10:00", end: "21:00"}

  categories:
    - {key: bath, label: "🔥 Програми в лазні на дровах"}
    - {key: hammam, label: "🛁 Програми в хамамі"}
    - {key: two, label: "💑 Спа-ритуали для двох"}
    - {key: company, label: "👥 Програми для компанії"}
    - {key: rest, label: "♨️ Відпочинок у термальній зоні"}
    - {key: massage, label: "💆 Масаж"}
    - {key: event, label: "🌙 Відкритий банний вечір"}

  deposit:
    percent: 50
    hold_min: 30
    rules: |-
      • Перенесення не пізніше ніж за 48 год — аванс залишається на депозиті.
      • Скасування в день візиту — аванс не повертається.
      • Запізнення не зменшує вартості: послуга триває залишок часу.

  visit_rules: |-
    📜 <b>Правила відвідування</b>

    1. Відвідування — лише за попереднім записом.
    2. Запізнення не зменшує вартості послуги: вона проводиться за залишковим часом.
    3. Бронювання спа-програм, відпочинку в термальній зоні й парних масажів — після авансу 50%. Перенесення за 48 год — аванс залишається на депозиті; скасування в день візиту — аванс не повертається.
    4. Скасування масажу день у день: наступний запис — лише з авансом 50%. За подарунковим сертифікатом при скасуванні день у день списується 100% вартості послуги.
    5. Не можна відвідувати термальну зону з відкритими ранами, переломами, медичними пов'язками, пластирями.
    6. Заборонено алкоголь, тютюн і наркотичні засоби, а також приносити свою їжу й напої.
    7. Віники, скраби, мед та інші засоби — лише разом із послугами пар-майстра.
    8. Стрибати в басейн заборонено.
    9. Додаткові послуги не продовжують тривалість спа-програми.
    10. Час оренди можна продовжити за доплату, якщо після вас немає іншого бронювання.
    11. Пошкоджене майно гість відшкодовує за ринковою вартістю.
    12. Ми не обслуговуємо гостей у стані сп'яніння; адміністрація може попросити гостя піти, якщо порушено правила.

    У вартість входять трав'яний чай, мед, вода й смаколики, халати, рушники, простирадла, пештемалі, одноразові тапочки, фен і засоби гігієни. Бажано мати із собою купальник/плавки й змінне взуття.

  certificate_amounts: [1000, 2000, 3000, 5000, 10000]

  # Налаштування послуг (прив'язка — за назвою, як у demo.services і в адмінці).
  # uses — ресурси: увесь час, last_min (останні N хв) або after_min (N хв після).
  # guests — гості: kinds (ліміти, включені в ціну й доплата за кожного понад них),
  # max_total — разом, tiers — ціна й тривалість за кількістю гостей першого виду.
  services:
    # --- Програми для одного гостя: лазня на дровах ---
    "Банне СПА «Колискова Тиші та Тепла»":
      category: bath
      deposit: true
      uses: [{resource: thermal}]
      addons: &program_addons
        - "Індивідуальна пропарка дубовими віниками"
        - "Мильний пінний масаж"
        - "Пілінг всього тіла"
        - "Глазурування глиною гассул"
        - "Глазурування білою глиною з дамаською трояндою"
        - "Глазурування рожевою глиною"
        - "Парафінотерапія стоп або рук"
        - "Зволоження всього тіла"
        - "Масаж бамбуковими віниками"
        - "Масаж однієї ділянки, 15 хв"
        - "Контрастні процедури мінеральною водою"
        - "Ванночки для ніг"
        - "Консультація на Таро"
      short: "Ніжне паріння дубовими віниками на гречаному матраці, сольовий скраб, чаювання й сон на гойдалці з музичною медитацією."
      full: >-
        Знайомство з програмою, ритуал першого пару — прогрів опахалом з ароматерапією травами.
        Лагідне паріння всього тіла дубовими віниками на гречаному матраці для заспокоєння та
        гармонізації внутрішнього стану. Холодне паріння, легкий контраст і розтирання березовими
        віниками для покращення кровообігу та зміцнення судин. Охолодження в басейні на руках у
        пар-майстра, ванночка для ніг із цитриною та морською сіллю. Сольове скрабування всього
        тіла з ефірними оліями. Чаювання з корисним пригощенням (карпатський чай, подільський мед,
        вода з лимоном, фрукти, сухофрукти, бублики). Сон на гойдалці з музичною медитацією.
    "Банне СПА «Повне Перезавантаження»":
      category: bath
      deposit: true
      uses: [{resource: thermal}]
      addons: *program_addons
      short: "Прогрів у хамамі, трьохетапний пілінг сіль-мед-лимон і пропарка дубовими віниками в слов'янській парній."
      full: >-
        Прогрів у хамамі, омивання тіла водою з чаш, трьохетапний пілінг: сіль-мед-лимон,
        ванночка для ніг із цитриною та морською сіллю, прогрів опахалом у слов'янській парній,
        пропарка дубовими віниками, контрастні процедури, користування басейном, відпочинок
        із чаюванням та пригощенням.
    "Банне СПА «Енергія Вогню»":
      category: bath
      deposit: true
      uses: [{resource: thermal}]
      addons: *program_addons
      short: "Ритуал першого пару з травами, індивідуальна пропарка, мильно-березове розтирання й прогрів гарячими потоками повітря."
      full: >-
        Прогрів у парній, ритуал першого пару — прогрів опахалом та ароматерапія травами,
        ванночка для ніг із цитриною та морською сіллю, індивідуальна пропарка дубовими віниками,
        мильно-березове розтирання всього тіла, прогрів гарячими повітряними потоками за допомогою
        простирадла, контрастні процедури, користування басейном, відпочинок із чаюванням та
        пригощенням.
    "Детокс Баня (тільки для дівчат)":
      category: bath
      deposit: true
      uses: [{resource: thermal}]
      addons: *program_addons
      short: "Інтервальне паріння, мильний пілінг і масаж блейдами найбільших м'язів тіла. Лише для дівчат."
      full: >-
        Плавання в басейні, прогрів у слов'янській парній, ванночка для ніг, мильний пілінг
        всього тіла, інтервальне паріння дубовими віниками, масаж блейдами найбільших м'язів
        тіла, чаювання.
    "Слов'янське паріння в бані":
      category: bath
      deposit: true
      uses: [{resource: thermal}]
      addons: *program_addons
      short: "Класичне паріння: ритуал першого пару, пропарка всього тіла дубовими віниками й контрастні процедури."
      full: >-
        Прогрів у парній, ритуал першого пару — прогрів опахалом, ванночка для ніг із цитриною
        та морською сіллю, пропарка всього тіла дубовими віниками, контрастні процедури,
        користування басейном, відпочинок із чаюванням та пригощенням.

    # --- Програми для одного гостя: хамам ---
    "Спа ритуал «Насолода з островів Індонезії»":
      category: hammam
      deposit: true
      uses: [{resource: thermal}]
      addons: *program_addons
      short: "Масаж кокосами в хамамі, кокосовий пілінг і маска для всього тіла, зволоження кокосовим молочком."
      full: >-
        Знайомство з програмою. Прогрів у хамамі, омивання тіла водою з чаш, масаж усього тіла
        спеціальними кокосами на живильному бальзамі з ароматами кокосу та ванілі (проводиться
        в хамамі). Пілінг усього тіла сольовим скрабом з екстрактом кокосу. Розслабляюча маска
        для всього тіла з м'якоттю кокоса. Ванночка для ніг з морською сіллю. Зволоження всього
        тіла кокосовим молочком. Користування басейном, відпочинок із чаюванням та пригощенням.
    "Марокканський хамам":
      category: hammam
      deposit: true
      # Термальна зона на всю програму + кабінет на останні 60 хв (релакс-масаж)
      uses: [{resource: thermal}, {resource: cabinet, last_min: 60}]
      addons: *program_addons
      short: "Гоммаж чорним милом бельді, кесе, глазурування глиною гассул і марокканський релакс-масаж у кабінеті."
      full: >-
        Прогрів у хамамі, омивання тіла водою з чаш, гоммаж чорним милом бельді, пілінг
        марокканською рукавичкою кесе, глазурування глиною гассул усього тіла та обличчя, миття
        голови з масажем, контрастні процедури, відпочинок у зоні басейну з чаюванням та
        пригощенням, ванночка для ніг, марокканський релакс-масаж усього тіла (проводиться в
        кабінеті).
    "Берберський хамам":
      category: hammam
      deposit: true
      uses: [{resource: thermal}]
      addons: *program_addons
      short: "Гоммаж чорним милом бельді, кесе, глазурування глиною гассул і зволоження тіла молочком."
      full: >-
